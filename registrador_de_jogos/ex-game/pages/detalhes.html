<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Veja os detalhes de um jogo no Game Tracker">

    <title>Detalhes do Jogo | EXgame</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
</head>

<body>

<div class="app-container">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <div class="logo">
            <h2>🎮 EXgame</h2>
        </div>

        <nav class="sidebar-nav">

            <a href="../index.html" class="nav-link">🏠 Início</a>
            <a href="explorar.html" class="nav-link active">🔎 Explorar</a>
            <a href="categorias.html" class="nav-link">🗂️ Categorias</a>
            <a href="favoritos.html" class="nav-link">❤️ Favoritos</a>
            <a href="minha-lista.html" class="nav-link">📋 Minha lista</a>
            <a href="destaques.html" class="nav-link">⭐ Destaques</a>

        </nav>

        <div class="sidebar-profile">
            <a href="perfil.html" class="nav-link">👤 Meu perfil</a>
        </div>

    </aside>

    <!-- CONTEÚDO -->
    <main class="main-content">

        <header class="page-header">

            <div class="page-heading">
                <h1>Detalhes do jogo</h1>
                <p>Confira as informações deste título.</p>
            </div>

            <a href="explorar.html" class="secondary-button">
                ← Voltar
            </a>

        </header>

        <section class="page-content">

            <article class="game-details" id="game-details">

                <!-- IMAGEM DO JOGO -->
                <div class="details-cover">
                    <img id="details-image" src="" alt="Capa do jogo">
                </div>

                <!-- INFORMAÇÕES DO JOGO -->
                <div class="details-content">

                    <span class="game-category" id="details-category"></span>

                    <h2 id="details-title">Carregando jogo...</h2>

                    <p class="details-description" id="details-description"></p>

                    <div class="details-information">

                        <div>
                            <span>Gênero</span>
                            <strong id="details-genre"></strong>
                        </div>

                        <div>
                            <span>Plataforma</span>
                            <strong id="details-platform"></strong>
                        </div>

                        <div>
                            <span>Desenvolvedora</span>
                            <strong id="details-developer"></strong>
                        </div>

                    </div>

                    <!-- AÇÕES -->
                    <div class="details-actions">

                        <button
                            type="button"
                            class="primary-button"
                            id="edit-game-button"
                        >
                            Editar jogo
                        </button>

                        <button
                            type="button"
                            class="secondary-button"
                            id="details-favorite-button"
                        >
                            ♡ Favoritar
                        </button>

                        <button
                            type="button"
                            class="secondary-button"
                            id="delete-game-button"
                        >
                            Excluir jogo
                        </button>

                    </div>

                    <!-- FORMULÁRIO DE EDIÇÃO -->
                    <form id="edit-game-form" hidden>

                        <h3>Editar informações do jogo</h3>

                        <div class="form-group">
                            <label for="edit-title">Título</label>
                            <input type="text" id="edit-title" required maxlength="100">
                        </div>

                        <div class="form-group">
                            <label for="edit-platform">Plataforma</label>
                            <input type="text" id="edit-platform" required>
                        </div>

                        <div class="form-group">
                            <label for="edit-genre">Gênero</label>
                            <input type="text" id="edit-genre" required>
                        </div>

                        <div class="form-group">
                            <label for="edit-image">Imagem (URL)</label>
                            <input type="url" id="edit-image">
                        </div>

                        <div class="form-group">
                            <label for="edit-description">Descrição</label>
                            <textarea id="edit-description" rows="4"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="edit-developer">Desenvolvedora</label>
                            <input type="text" id="edit-developer">
                        </div>

                        <div class="form-actions">

                            <button
                                type="submit"
                                class="primary-button"
                            >
                                Salvar alterações
                            </button>

                            <button
                                type="button"
                                class="secondary-button"
                                id="cancel-edit-button"
                            >
                                Cancelar
                            </button>

                        </div>

                    </form>

                </div>

            </article>
        </section>

        <footer class="footer">
            <p>© 2026 Game Tracker. Organize suas experiências.</p>
        </footer>

    </main>

</div>

<script src="../js/api.js" defer></script>
<script src="../js/detalhes.js" defer></script>
<script src="../js/navegacao.js" defer></script>

</body>
</html>
