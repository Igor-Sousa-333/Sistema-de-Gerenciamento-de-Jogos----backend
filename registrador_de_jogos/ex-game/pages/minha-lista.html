
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sua biblioteca pessoal de jogos">
    <title>Minha Lista | EXgame</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    </head>

<body>

<div class="app-container">

    <aside class="sidebar">

        <a href="../../index.html" class="logo">EX<span>Game</span></a>
        <nav class="sidebar-navigation">
            <div class="nav-group">
                <p class="nav-title">MENU PRINCIPAL</p>
                <a href="../../index.html" class="nav-link"><span class="nav-icon">⌂</span>Início</a>
                <a href="categorias.html" class="nav-link"><span class="nav-icon">▦</span>Categorias</a>
            </div>
            <div class="nav-group">
                <p class="nav-title">MINHA BIBLIOTECA</p>
                <a href="favoritos.html" class="nav-link"><span class="nav-icon">♡</span>Favoritos</a>
                <a href="minha-lista.html" class="nav-link active"><span class="nav-icon">▤</span>Minha lista</a>
            </div>
        </nav>
        <div class="sidebar-bottom">
            <a href="perfil.html" class="profile-link">
                <div class="profile-avatar">G</div>
                <div class="profile-info"><strong>Meu perfil</strong><span>Minha conta</span></div>
            </a>
        </div>

    </aside>

    <main class="main-content">

        <header class="page-header">

            <div class="page-heading">
                <h1>Minha lista 📋</h1>
                <p>Acompanhe seus jogos e organize seu progresso.</p>
            </div>

            <a href="../../index.html" class="add-button">
                + Ver jogos
            </a>

        </header>

        <section class="page-content">

            <!-- RESUMO DA BIBLIOTECA -->
            <div class="profile-stats">

                <div class="profile-stat">
                    <strong id="list-total">0</strong>
                    <span>Total de jogos</span>
                </div>

                <div class="profile-stat">
                    <strong id="list-playing">0</strong>
                    <span>Jogando</span>
                </div>

                <div class="profile-stat">
                    <strong id="list-completed">0</strong>
                    <span>Concluídos</span>
                </div>

            </div>

            <!-- FILTROS DE STATUS -->
            <div class="list-filters">

                <button class="filter-tab active" data-status="todos">
                    Todos
                </button>

                <button class="filter-tab" data-status="quero-jogar">
                    Quero jogar
                </button>

                <button class="filter-tab" data-status="jogando">
                    Jogando
                </button>

                <button class="filter-tab" data-status="concluido">
                    Concluídos
                </button>

                <button class="filter-tab" data-status="abandonado">
                    Abandonados
                </button>

            </div>

            <!-- LISTA DE JOGOS -->
            <div class="games-grid" id="my-games-grid"></div>

        </section>

        <footer class="footer">
            <p>© 2026 Game Tracker. Organize suas experiências.</p>
        </footer>

    </main>

</div>

<script src="../js/api.js" defer></script>
<script src="../js/minha-lista.js" defer></script>
<script src="../js/navegacao.js" defer></script>

</body>
</html>
